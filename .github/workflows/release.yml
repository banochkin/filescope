name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Secrets are not allowed in `if:` expressions — GitHub rejects the whole
    # workflow file. Exposing it as an environment variable makes the same test
    # legal, and keeps Open VSX optional.
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check-types
      - run: npm run compile-tests
      - run: xvfb-run -a npx vscode-test

      - name: Package
        run: npx @vscode/vsce package --out filescope.vsix

      # Scoped to a single Azure DevOps organisation on purpose: global tokens
      # ("All accessible organizations") are retired on 2026-12-01, org-scoped
      # ones are not. See docs/PUBLISHING.md for the token-free alternative.
      - name: Publish to the Visual Studio Marketplace
        run: npx @vscode/vsce publish --packagePath filescope.vsix --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx ovsx publish filescope.vsix --skip-duplicate

      - name: Attach the VSIX to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: filescope.vsix
          generate_release_notes: true
