name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # The federated credential trusts this environment by name. It must match the
    # GitHub environment configured on the managed identity, or the OIDC exchange
    # is refused before anything is published.
    environment: marketplace-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check-types
      - run: npm run compile-tests
      - run: xvfb-run -a npx vscode-test

      - name: Package
        run: npx @vscode/vsce package --out filescope.vsix

      # Workload identity federation: no long-lived secret is stored, the OIDC
      # token GitHub mints here is valid for minutes. AZURE_CLIENT_ID is the
      # managed identity's client id and is not a secret in any meaningful sense,
      # but it is kept in secrets to avoid publishing tenant topology.
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to the Visual Studio Marketplace
        run: npx @vscode/vsce publish --packagePath filescope.vsix --azure-credential --skip-duplicate

      - name: Publish to Open VSX
        if: ${{ secrets.OVSX_PAT != '' }}
        run: npx ovsx publish filescope.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Attach the VSIX to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: filescope.vsix
          generate_release_notes: true
